<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p{
            padding:0px;
            margin:0px;
        }
        .container{
            width:500px;
            height:200px;
            color:white;
            font-size: 40px;
            font-weight:900;
            text-align:center;
            position:sticky;
            top:30px;

        }
        #box1{
            background-color:black;
            position:relative;
        }
        #box2{
            background-color:blue;

        }
        #box3{
            background-color:yellow;

        }
        #box4{
            background-color:green;

        }
    </style>
</head>
<body>
    <div class = "container">
        <div class = "container" id="box1">
            <p>1</p>
        </div>
        <div class = "container" id="box2">
            <p>2</p>
        </div>
        <div class = "container" id="box3">
            <p>3</p>
        </div>
        <div class = "container" id="box4">
            <p>4</p>
        </div>
    </div>
</body>
</html>
