    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Grid ke baare mai padha rhe hai</title>
        <style>
            :root{
                --primary-color: blue;
                --font-size:30px; 
            }
            .container{
                background-color: var(--primary-color);
                outline:1px solid;
                display: grid;
                font-size:calc(var(--font-size)/2);
                height:600px;
                width:700px;
                grid-template-columns:1fr 1fr 1fr;
                grid-template-rows:1fr 1fr 1fr;     
            }
            .container>div{
                font-size:30px; 
                outline: 1px dashed black;
            }
            .parent{
                --primary-color:black;
                display:grid;
                background-color:white;
                grid-template-columns:subgrid;
                grid-column: 1/3;
                grid-row: 1/3;
            }
            .child1{
                background-color:black;
                color:white;
                grid-column: 1/2;
                grid-row:2/3;   

            }
            .child2{
                background-color:var(--primary-color);
                color:white;
                grid-column: 2/3;
                grid-row:1/2;   

            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="parent">
                <div class="child1">1</div>
                <div class="child2">2</div>
            </div>
        </div>
    </body>
    </html>
